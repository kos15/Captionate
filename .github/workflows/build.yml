name: Build DMG

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Package.swift"
      - "build.sh"
  pull_request:
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Package.swift"
      - "build.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      background:
        description: "DMG background (dots, grid, diagonal, waves)"
        default: dots
        type: choice
        options: [dots, grid, diagonal, waves]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      # Optional repo secrets — when set, the DMG is Developer ID signed + notarized
      # so macOS opens it without the "Apple could not verify…" warning.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}            # base64 of the Developer ID Application .p12
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}                    # "Developer ID Application: Name (TEAMID)"
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}          # app-specific password from appleid.apple.com
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Skip signing when no certificate is configured
        if: env.MACOS_CERTIFICATE == ''
        run: echo "SIGN_IDENTITY=" >> "$GITHUB_ENV"

      - name: Build app and DMG
        env:
          DMG_BACKGROUND: ${{ inputs.background || 'dots' }}
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Captionate.dmg
          path: build/Captionate.dmg

      - name: Commit the fresh DMG (served by the website's Download button)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/Captionate.dmg build/Captionate.app
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild Captionate.dmg [skip ci]"
          git push
